name: "Update Dataset"
on:
    schedule:
        - cron: "0 12 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install PNPM
              run: npm install -g pnpm

            - name: Sync node version and setup cache
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"
                  cache: "pnpm"
                  cache-dependency-path: supabase-dataset-updater/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: supabase-dataset-updater
              run: pnpm install

            - name: Run ETL
              working-directory: supabase-dataset-updater
              run: pnpm etl
              env:
                  CDN_BASE_URL: https://chertixd.github.io/lol-draft-helper-cdn/data

            - name: Self-check outputs (Layer 2)
              working-directory: supabase-dataset-updater
              run: pnpm self-check

            # Preserve auto-updater manifest. The release.yml workflow publishes
            # latest.json to the CDN root (NOT under data/) for tauri-plugin-updater.
            # Our publish below uses force_orphan: true which would wipe it.
            # Fetch the live copy and stage it for re-publish so the daily cron
            # never breaks the auto-updater.
            - name: Preserve latest.json from CDN root
              working-directory: supabase-dataset-updater
              shell: bash
              run: |
                  curl -fsS https://chertixd.github.io/lol-draft-helper-cdn/latest.json \
                      -o public/latest.json \
                      && echo "[preserve] latest.json staged for re-publish" \
                      || echo "[preserve] no latest.json on CDN yet (release pending) — skipping"

            - name: Publish to gh-pages branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  personal_token: ${{ secrets.CDN_DEPLOY_TOKEN }}
                  external_repository: Chertixd/lol-draft-helper-cdn
                  publish_dir: ./supabase-dataset-updater/public
                  publish_branch: gh-pages
                  force_orphan: true
                  user_name: "github-actions[bot]"
                  user_email: "github-actions[bot]@users.noreply.github.com"
                  commit_message: "data: refresh ${{ github.run_id }}"

            - name: Smoke-test live CDN (Layer 3)
              working-directory: supabase-dataset-updater
              run: pnpm smoke-test
              env:
                  CDN_BASE_URL: https://chertixd.github.io/lol-draft-helper-cdn/data
